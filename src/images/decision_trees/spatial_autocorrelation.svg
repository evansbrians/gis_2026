<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 546 775" width="546" height="775" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="546" height="775" fill="#ffffff"/>
<text x="273" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#292093">Workflow: Measuring spatial autocorrelation</text>
<line x1="40" y1="50" x2="506" y2="50" stroke="#9db0e6" stroke-width="1.2"/>
<g transform="translate(0,52)">
<path d="M 273.0 135.0 V 168.0" fill="none" stroke="#9db0e6" stroke-width="1.8"/>
<polygon points="273.0,179.0 268.0,167.0 278.0,167.0" fill="#9db0e6"/>
<rect x="256.2" y="151.0" width="33.6" height="17.0" rx="3" fill="#ffffff"/>
<text x="273.0" y="162.0" text-anchor="middle" font-size="12" fill="#4a5aa0">then</text>
<path d="M 273.0 260.0 V 293.0" fill="none" stroke="#9db0e6" stroke-width="1.8"/>
<polygon points="273.0,304.0 268.0,292.0 278.0,292.0" fill="#9db0e6"/>
<rect x="256.2" y="276.0" width="33.6" height="17.0" rx="3" fill="#ffffff"/>
<text x="273.0" y="287.0" text-anchor="middle" font-size="12" fill="#4a5aa0">then</text>
<path d="M 273.0 401.0 V 434.0" fill="none" stroke="#9db0e6" stroke-width="1.8"/>
<polygon points="273.0,445.0 268.0,433.0 278.0,433.0" fill="#9db0e6"/>
<rect x="256.2" y="417.0" width="33.6" height="17.0" rx="3" fill="#ffffff"/>
<text x="273.0" y="428.0" text-anchor="middle" font-size="12" fill="#4a5aa0">then</text>
<path d="M 273.0 542.0 V 575.0" fill="none" stroke="#9db0e6" stroke-width="1.8"/>
<polygon points="273.0,586.0 268.0,574.0 278.0,574.0" fill="#9db0e6"/>
<rect x="259.6" y="558.0" width="26.7" height="17.0" rx="3" fill="#ffffff"/>
<text x="273.0" y="569.0" text-anchor="middle" font-size="12" fill="#4a5aa0">and</text>
<rect x="30.0" y="40.0" width="486" height="95" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="273.0" y="65.0" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.2" fill="#292093">NEIGHBORS</text>
<text x="273.0" y="85.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">st_contiguity()   st_knn()   st_dist_band()</text>
<text x="273.0" y="102.0" text-anchor="middle" font-size="12" fill="#5d5d70">polygons that touch, the k nearest points, or the points</text>
<text x="273.0" y="118.0" text-anchor="middle" font-size="12" fill="#5d5d70">within a range of distances; state the choice</text>
<rect x="30.0" y="181.0" width="486" height="79" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="273.0" y="206.0" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.2" fill="#292093">WEIGHTS</text>
<text x="273.0" y="226.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">st_weights()</text>
<text x="273.0" y="243.0" text-anchor="middle" font-size="12" fill="#5d5d70">each neighbor an equal share of one, by default</text>
<rect x="30.0" y="306.0" width="486" height="95" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="273.0" y="331.0" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.2" fill="#292093">THE GLOBAL STATISTIC</text>
<text x="273.0" y="351.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">global_moran()   global_moran_perm()   autocor()</text>
<text x="273.0" y="368.0" text-anchor="middle" font-size="12" fill="#5d5d70">Moran's I, tested by shuffling the values; autocor() does</text>
<text x="273.0" y="384.0" text-anchor="middle" font-size="12" fill="#5d5d70">all three steps for a raster, whose neighbors are the grid</text>
<rect x="30.0" y="447.0" width="486" height="95" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="273.0" y="472.0" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.2" fill="#292093">WHERE THE CLUSTERS ARE</text>
<text x="273.0" y="492.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">local_moran()  %&gt;%  unnest()</text>
<text x="273.0" y="509.0" text-anchor="middle" font-size="12" fill="#5d5d70">one statistic and one label per polygon; keep the labels</text>
<text x="273.0" y="525.0" text-anchor="middle" font-size="12" fill="#5d5d70">with small p-values and read the blocks, not the singles</text>
<rect x="30.0" y="588.0" width="486" height="111" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="273.0" y="613.0" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.2" fill="#292093">HOW FAR IT REACHES</text>
<text x="273.0" y="633.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">st_dist_band()  inside  map2_dbl()</text>
<text x="273.0" y="650.0" text-anchor="middle" font-size="12" fill="#5d5d70">Moran's I for each band of distance; the distance at which</text>
<text x="273.0" y="666.0" text-anchor="middle" font-size="12" fill="#5d5d70">it reaches zero is the range, and samples closer than</text>
<text x="273.0" y="682.0" text-anchor="middle" font-size="12" fill="#5d5d70">that are not independent</text>
</g>
</svg>
