<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 791" width="550" height="791" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="550" height="791" fill="#ffffff"/>
<text x="275" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#292093">Workflow: The parts of an app</text>
<line x1="40" y1="50" x2="510" y2="50" stroke="#9db0e6" stroke-width="1.2"/>
<g transform="translate(0,52)">
<path d="M 275.0 135.0 V 168.0" fill="none" stroke="#9db0e6" stroke-width="1.8"/>
<polygon points="275.0,179.0 270.0,167.0 280.0,167.0" fill="#9db0e6"/>
<rect x="258.2" y="151.0" width="33.6" height="17.0" rx="3" fill="#ffffff"/>
<text x="275.0" y="162.0" text-anchor="middle" font-size="12" fill="#4a5aa0">then</text>
<path d="M 275.0 292.0 V 325.0" fill="none" stroke="#9db0e6" stroke-width="1.8"/>
<polygon points="275.0,336.0 270.0,324.0 280.0,324.0" fill="#9db0e6"/>
<rect x="258.2" y="308.0" width="33.6" height="17.0" rx="3" fill="#ffffff"/>
<text x="275.0" y="319.0" text-anchor="middle" font-size="12" fill="#4a5aa0">then</text>
<path d="M 275.0 433.0 V 466.0" fill="none" stroke="#9db0e6" stroke-width="1.8"/>
<polygon points="275.0,477.0 270.0,465.0 280.0,465.0" fill="#9db0e6"/>
<rect x="258.2" y="449.0" width="33.6" height="17.0" rx="3" fill="#ffffff"/>
<text x="275.0" y="460.0" text-anchor="middle" font-size="12" fill="#4a5aa0">then</text>
<path d="M 275.0 574.0 V 607.0" fill="none" stroke="#9db0e6" stroke-width="1.8"/>
<polygon points="275.0,618.0 270.0,606.0 280.0,606.0" fill="#9db0e6"/>
<rect x="258.2" y="590.0" width="33.6" height="17.0" rx="3" fill="#ffffff"/>
<text x="275.0" y="601.0" text-anchor="middle" font-size="12" fill="#4a5aa0">then</text>
<rect x="8.0" y="40.0" width="534" height="95" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="275.0" y="65.0" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.2" fill="#292093">AT THE TOP OF THE FILE</text>
<text x="275.0" y="85.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">attach the packages; read the data once</text>
<text x="275.0" y="102.0" text-anchor="middle" font-size="12" fill="#5d5d70">paths are relative to the app's folder, which carries</text>
<text x="275.0" y="118.0" text-anchor="middle" font-size="12" fill="#5d5d70">its data with it</text>
<rect x="8.0" y="181.0" width="534" height="111" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="275.0" y="206.0" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.2" fill="#292093">THE INTERFACE</text>
<text x="275.0" y="226.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">page_sidebar()   sidebar()   card()</text>
<text x="275.0" y="243.0" text-anchor="middle" font-size="12" fill="#5d5d70">selectInput() filled with set_names() from the data;</text>
<text x="275.0" y="259.0" text-anchor="middle" font-size="12" fill="#5d5d70">actionButton() for an event, downloadButton() for a file;</text>
<text x="275.0" y="275.0" text-anchor="middle" font-size="12" fill="#5d5d70">tmapOutput() and tableOutput() where results go</text>
<rect x="8.0" y="338.0" width="534" height="95" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="275.0" y="363.0" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.2" fill="#292093">THE SERVER</text>
<text x="275.0" y="383.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">reactive()  chained;  eventReactive()  for the button</text>
<text x="275.0" y="400.0" text-anchor="middle" font-size="12" fill="#5d5d70">each expression reads the one before it, and only the</text>
<text x="275.0" y="416.0" text-anchor="middle" font-size="12" fill="#5d5d70">expressions that read what changed re-run</text>
<rect x="8.0" y="479.0" width="534" height="95" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="275.0" y="504.0" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.2" fill="#292093">THE OUTPUTS</text>
<text x="275.0" y="524.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">renderTmap()   renderTable()   downloadHandler()</text>
<text x="275.0" y="541.0" text-anchor="middle" font-size="12" fill="#5d5d70">the drawing and nothing else; the handler's content</text>
<text x="275.0" y="557.0" text-anchor="middle" font-size="12" fill="#5d5d70">function writes to the path Shiny supplies</text>
<rect x="8.0" y="620.0" width="534" height="95" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="275.0" y="645.0" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.2" fill="#292093">TEST, THEN DEPLOY</text>
<text x="275.0" y="665.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">testServer()   rsconnect::deployApp()</text>
<text x="275.0" y="682.0" text-anchor="middle" font-size="12" fill="#5d5d70">check the reactive expressions without a browser;</text>
<text x="275.0" y="698.0" text-anchor="middle" font-size="12" fill="#5d5d70">deploy the folder, with everything the app reads inside it</text>
</g>
</svg>
