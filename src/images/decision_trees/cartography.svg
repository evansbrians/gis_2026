<rect x="192.6" y="41.0" width="88.8" height="17.0" rx="3" fill="#ffffff"/>
<text x="237.0" y="52.0" text-anchor="middle" font-size="12" fill="#4a5aa0">what to draw</text>
<rect x="189.2" y="134.0" width="95.7" height="30.0" rx="3" fill="#ffffff"/>
<text x="237.0" y="145.0" text-anchor="middle" font-size="12" fill="#4a5aa0">how to encode</text>
<text x="237.0" y="158.0" text-anchor="middle" font-size="12" fill="#4a5aa0">the value</text>
<rect x="171.9" y="240.0" width="130.2" height="30.0" rx="3" fill="#ffffff"/>
<text x="237.0" y="251.0" text-anchor="middle" font-size="12" fill="#4a5aa0">how to classify</text>
<text x="237.0" y="264.0" text-anchor="middle" font-size="12" fill="#4a5aa0">a continuous value</text>
<rect x="192.6" y="365.0" width="88.8" height="17.0" rx="3" fill="#ffffff"/>
<text x="237.0" y="376.0" text-anchor="middle" font-size="12" fill="#4a5aa0">which colors</text>
<rect x="178.8" y="472.0" width="116.4" height="30.0" rx="3" fill="#ffffff"/>
<text x="237.0" y="483.0" text-anchor="middle" font-size="12" fill="#4a5aa0">what the reader</text>
<text x="237.0" y="496.0" text-anchor="middle" font-size="12" fill="#4a5aa0">needs to read it</text>
<rect x="185.7" y="586.0" width="102.6" height="30.0" rx="3" fill="#ffffff"/>
<text x="237.0" y="597.0" text-anchor="middle" font-size="12" fill="#4a5aa0">how to compare</text>
<text x="237.0" y="610.0" text-anchor="middle" font-size="12" fill="#4a5aa0">groups</text>
<rect x="8.0" y="309.0" width="140" height="64" rx="9" fill="#eaf0ff" stroke="#292093" stroke-width="2.0"/>
<text x="78.0" y="336.0" text-anchor="middle" font-size="15" fill="#333333">Which decision</text>
<text x="78.0" y="355.0" text-anchor="middle" font-size="15" fill="#333333">are you making?</text>
<rect x="316.0" y="23.0" width="337" height="78" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="484.5" y="51.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">layer order</text>
<text x="484.5" y="68.0" text-anchor="middle" font-size="12" fill="#5d5d70">context first, subject last</text>
<text x="484.5" y="84.0" text-anchor="middle" font-size="12" fill="#5d5d70">geom_sf()  ~  tm_shape() + a geometry</text>
<rect x="316.0" y="129.0" width="337" height="78" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="484.5" y="157.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">the visual variable</text>
<text x="484.5" y="174.0" text-anchor="middle" font-size="12" fill="#5d5d70">for these maps, polygon: fill; point: size,</text>
<text x="484.5" y="190.0" text-anchor="middle" font-size="12" fill="#5d5d70">color or shape; line: color or width</text>
<rect x="316.0" y="235.0" width="337" height="78" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="484.5" y="263.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">the scale</text>
<text x="484.5" y="280.0" text-anchor="middle" font-size="12" fill="#5d5d70">every value its own color, or classes from</text>
<text x="484.5" y="296.0" text-anchor="middle" font-size="12" fill="#5d5d70">tm_scale_intervals(style = )</text>
<rect x="316.0" y="339.0" width="337" height="94" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="484.5" y="367.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">the palette</text>
<text x="484.5" y="384.0" text-anchor="middle" font-size="12" fill="#5d5d70">sequential for a low-to-high variable; diverging</text>
<text x="484.5" y="400.0" text-anchor="middle" font-size="12" fill="#5d5d70">around a midpoint; categorical for groups; check</text>
<text x="484.5" y="416.0" text-anchor="middle" font-size="12" fill="#5d5d70">the palette for color vision deficiency</text>
<rect x="316.0" y="459.0" width="337" height="94" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="484.5" y="487.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">the map elements</text>
<text x="484.5" y="504.0" text-anchor="middle" font-size="12" fill="#5d5d70">title and legend for encoded values; tm_compass()</text>
<text x="484.5" y="520.0" text-anchor="middle" font-size="12" fill="#5d5d70">if orientation is unclear; tm_scalebar() where</text>
<text x="484.5" y="536.0" text-anchor="middle" font-size="12" fill="#5d5d70">scale variation is small; tm_credits() for sources</text>
<rect x="316.0" y="581.0" width="337" height="78" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="484.5" y="609.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">facets</text>
<text x="484.5" y="626.0" text-anchor="middle" font-size="12" fill="#5d5d70">facet_wrap()  ~  tm_facets_wrap()</text>
<text x="484.5" y="642.0" text-anchor="middle" font-size="12" fill="#5d5d70">shared scale for absolute comparisons by color</text>
</g>
</svg>
