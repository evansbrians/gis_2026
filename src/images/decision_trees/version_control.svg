<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 686 775" width="686" height="775" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="686" height="775" fill="#ffffff"/>
<text x="343" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#292093">Workflow: Version control with git and GitHub</text>
<line x1="40" y1="50" x2="646" y2="50" stroke="#9db0e6" stroke-width="1.2"/>
<g transform="translate(0,52)">
<path d="M 343.0 135.0 V 168.0" fill="none" stroke="#9db0e6" stroke-width="1.8"/>
<polygon points="343.0,179.0 338.0,167.0 348.0,167.0" fill="#9db0e6"/>
<rect x="326.2" y="151.0" width="33.6" height="17.0" rx="3" fill="#ffffff"/>
<text x="343.0" y="162.0" text-anchor="middle" font-size="12" fill="#4a5aa0">then</text>
<path d="M 343.0 276.0 V 309.0" fill="none" stroke="#9db0e6" stroke-width="1.8"/>
<polygon points="343.0,320.0 338.0,308.0 348.0,308.0" fill="#9db0e6"/>
<rect x="326.2" y="292.0" width="33.6" height="17.0" rx="3" fill="#ffffff"/>
<text x="343.0" y="303.0" text-anchor="middle" font-size="12" fill="#4a5aa0">then</text>
<path d="M 343.0 417.0 V 450.0" fill="none" stroke="#9db0e6" stroke-width="1.8"/>
<polygon points="343.0,461.0 338.0,449.0 348.0,449.0" fill="#9db0e6"/>
<rect x="326.2" y="433.0" width="33.6" height="17.0" rx="3" fill="#ffffff"/>
<text x="343.0" y="444.0" text-anchor="middle" font-size="12" fill="#4a5aa0">then</text>
<path d="M 343.0 558.0 V 591.0" fill="none" stroke="#9db0e6" stroke-width="1.8"/>
<polygon points="343.0,602.0 338.0,590.0 348.0,590.0" fill="#9db0e6"/>
<rect x="326.2" y="574.0" width="33.6" height="17.0" rx="3" fill="#ffffff"/>
<text x="343.0" y="585.0" text-anchor="middle" font-size="12" fill="#4a5aa0">then</text>
<rect x="8.0" y="40.0" width="670" height="95" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="343.0" y="65.0" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.2" fill="#292093">SET UP ONCE</text>
<text x="343.0" y="85.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">use_git_config()   git_default_branch_configure()   git_vaccinate()</text>
<text x="343.0" y="102.0" text-anchor="middle" font-size="12" fill="#5d5d70">the name and email on every commit, main as the branch,</text>
<text x="343.0" y="118.0" text-anchor="middle" font-size="12" fill="#5d5d70">RStudio's files ignored everywhere; git_sitrep() checks it</text>
<rect x="8.0" y="181.0" width="670" height="95" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="343.0" y="206.0" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.2" fill="#292093">MAKE THE PROJECT A REPOSITORY</text>
<text x="343.0" y="226.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">use_git_ignore()  then  use_git()</text>
<text x="343.0" y="243.0" text-anchor="middle" font-size="12" fill="#5d5d70">decide what is not tracked before the first commit,</text>
<text x="343.0" y="259.0" text-anchor="middle" font-size="12" fill="#5d5d70">because a committed file stays in the history</text>
<rect x="8.0" y="322.0" width="670" height="95" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="343.0" y="347.0" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.2" fill="#292093">CONNECT TO GITHUB ONCE</text>
<text x="343.0" y="367.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">create_github_token()   gitcreds_set()   use_github()</text>
<text x="343.0" y="384.0" text-anchor="middle" font-size="12" fill="#5d5d70">the token is stored where R can find it and a script</text>
<text x="343.0" y="400.0" text-anchor="middle" font-size="12" fill="#5d5d70">cannot; use_github() creates the remote and pushes</text>
<rect x="8.0" y="463.0" width="670" height="95" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="343.0" y="488.0" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.2" fill="#292093">THE CYCLE</text>
<text x="343.0" y="508.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">edit  &gt;  stage  &gt;  commit  &gt;  push</text>
<text x="343.0" y="525.0" text-anchor="middle" font-size="12" fill="#5d5d70">one change per commit, with a message that says</text>
<text x="343.0" y="541.0" text-anchor="middle" font-size="12" fill="#5d5d70">what the change was for</text>
<rect x="8.0" y="604.0" width="670" height="95" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="343.0" y="629.0" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.2" fill="#292093">WORK WITH OTHERS</text>
<text x="343.0" y="649.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">pull before starting, commit before pulling</text>
<text x="343.0" y="666.0" text-anchor="middle" font-size="12" fill="#5d5d70">create_from_github() starts a project from a repository</text>
<text x="343.0" y="682.0" text-anchor="middle" font-size="12" fill="#5d5d70">that exists; use_readme_md() says how to run it</text>
</g>
</svg>
