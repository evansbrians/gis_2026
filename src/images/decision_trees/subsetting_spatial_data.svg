<rect x="187.3" y="31.0" width="47.4" height="17.0" rx="3" fill="#ffffff"/>
<text x="211.0" y="42.0" text-anchor="middle" font-size="12" fill="#4a5aa0">fields</text>
<rect x="180.4" y="227.0" width="61.2" height="17.0" rx="3" fill="#ffffff"/>
<text x="211.0" y="238.0" text-anchor="middle" font-size="12" fill="#4a5aa0">features</text>
<rect x="523.0" y="155.0" width="68.1" height="30.0" rx="3" fill="#ffffff"/>
<text x="557.0" y="166.0" text-anchor="middle" font-size="12" fill="#4a5aa0">values in</text>
<text x="557.0" y="179.0" text-anchor="middle" font-size="12" fill="#4a5aa0">a field</text>
<rect x="485.0" y="273.0" width="144.0" height="30.0" rx="3" fill="#ffffff"/>
<text x="557.0" y="284.0" text-anchor="middle" font-size="12" fill="#4a5aa0">location relative to</text>
<text x="557.0" y="297.0" text-anchor="middle" font-size="12" fill="#4a5aa0">another object</text>
<rect x="905.6" y="152.0" width="88.8" height="30.0" rx="3" fill="#ffffff"/>
<text x="950.0" y="163.0" text-anchor="middle" font-size="12" fill="#4a5aa0">any shared</text>
<text x="950.0" y="176.0" text-anchor="middle" font-size="12" fill="#4a5aa0">space at all</text>
<rect x="916.0" y="252.0" width="68.1" height="30.0" rx="3" fill="#ffffff"/>
<text x="950.0" y="263.0" text-anchor="middle" font-size="12" fill="#4a5aa0">no shared</text>
<text x="950.0" y="276.0" text-anchor="middle" font-size="12" fill="#4a5aa0">space</text>
<rect x="884.9" y="352.0" width="130.2" height="30.0" rx="3" fill="#ffffff"/>
<text x="950.0" y="363.0" text-anchor="middle" font-size="12" fill="#4a5aa0">one falls entirely</text>
<text x="950.0" y="376.0" text-anchor="middle" font-size="12" fill="#4a5aa0">inside the other</text>
<rect x="895.2" y="452.0" width="109.5" height="30.0" rx="3" fill="#ffffff"/>
<text x="950.0" y="463.0" text-anchor="middle" font-size="12" fill="#4a5aa0">they share only</text>
<text x="950.0" y="476.0" text-anchor="middle" font-size="12" fill="#4a5aa0">a boundary</text>
<rect x="905.6" y="552.0" width="88.8" height="30.0" rx="3" fill="#ffffff"/>
<text x="950.0" y="563.0" text-anchor="middle" font-size="12" fill="#4a5aa0">they overlap</text>
<text x="950.0" y="576.0" text-anchor="middle" font-size="12" fill="#4a5aa0">in part</text>
<rect x="902.1" y="652.0" width="95.7" height="30.0" rx="3" fill="#ffffff"/>
<text x="950.0" y="663.0" text-anchor="middle" font-size="12" fill="#4a5aa0">they are near</text>
<text x="950.0" y="676.0" text-anchor="middle" font-size="12" fill="#4a5aa0">each other</text>
<rect x="8.0" y="118.0" width="148" height="64" rx="9" fill="#eaf0ff" stroke="#292093" stroke-width="2.0"/>
<text x="82.0" y="145.0" text-anchor="middle" font-size="15" fill="#333333">What do you want</text>
<text x="82.0" y="164.0" text-anchor="middle" font-size="15" fill="#333333">to subset?</text>
<rect x="256.0" y="13.0" width="205" height="78" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="358.5" y="41.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">select()</text>
<text x="358.5" y="58.0" text-anchor="middle" font-size="12" fill="#5d5d70">returns the fields you name,</text>
<text x="358.5" y="74.0" text-anchor="middle" font-size="12" fill="#5d5d70">and keeps the geometry</text>
<rect x="256.0" y="216.0" width="205" height="64" rx="9" fill="#eaf0ff" stroke="#292093" stroke-width="2.0"/>
<text x="358.5" y="243.0" text-anchor="middle" font-size="15" fill="#333333">What is the basis</text>
<text x="358.5" y="262.0" text-anchor="middle" font-size="15" fill="#333333">for the subset?</text>
<rect x="643.0" y="150.0" width="218" height="78" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="752.0" y="178.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">filter()</text>
<text x="752.0" y="195.0" text-anchor="middle" font-size="12" fill="#5d5d70">the condition is a test</text>
<text x="752.0" y="211.0" text-anchor="middle" font-size="12" fill="#5d5d70">of the values in a field</text>
<rect x="643.0" y="268.0" width="218" height="78" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="752.0" y="296.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">st_filter()</text>
<text x="752.0" y="313.0" text-anchor="middle" font-size="12" fill="#5d5d70">the condition is a spatial</text>
<text x="752.0" y="329.0" text-anchor="middle" font-size="12" fill="#5d5d70">predicate, set by .predicate =</text>
<rect x="643.0" y="404.0" width="218" height="64" rx="9" fill="#eaf0ff" stroke="#292093" stroke-width="2.0"/>
<text x="752.0" y="431.0" text-anchor="middle" font-size="15" fill="#333333">What is the relationship</text>
<text x="752.0" y="450.0" text-anchor="middle" font-size="15" fill="#333333">between the objects?</text>
<rect x="1029.0" y="155.0" width="271" height="62" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="1164.5" y="183.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">st_intersects()</text>
<text x="1164.5" y="200.0" text-anchor="middle" font-size="12" fill="#5d5d70">the default predicate</text>
<rect x="1029.0" y="247.0" width="271" height="78" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="1164.5" y="275.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">st_disjoint()</text>
<text x="1164.5" y="292.0" text-anchor="middle" font-size="12" fill="#5d5d70">union the second object first, so that</text>
<text x="1164.5" y="308.0" text-anchor="middle" font-size="12" fill="#5d5d70">any feature means the whole object</text>
<rect x="1029.0" y="347.0" width="271" height="78" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="1164.5" y="375.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">st_within()</text>
<text x="1164.5" y="392.0" text-anchor="middle" font-size="12" fill="#5d5d70">st_contains() asks the same</text>
<text x="1164.5" y="408.0" text-anchor="middle" font-size="12" fill="#5d5d70">question from the other end</text>
<rect x="1029.0" y="447.0" width="271" height="78" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="1164.5" y="475.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">st_touches()</text>
<text x="1164.5" y="492.0" text-anchor="middle" font-size="12" fill="#5d5d70">boundaries touch,</text>
<text x="1164.5" y="508.0" text-anchor="middle" font-size="12" fill="#5d5d70">interiors do not</text>
<rect x="1029.0" y="547.0" width="271" height="78" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="1164.5" y="575.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">st_overlaps()</text>
<text x="1164.5" y="592.0" text-anchor="middle" font-size="12" fill="#5d5d70">neither one contains</text>
<text x="1164.5" y="608.0" text-anchor="middle" font-size="12" fill="#5d5d70">the other</text>
<rect x="1029.0" y="647.0" width="271" height="78" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="1164.5" y="675.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">st_is_within_distance()</text>
<text x="1164.5" y="692.0" text-anchor="middle" font-size="12" fill="#5d5d70">dist = is read in the</text>
<text x="1164.5" y="708.0" text-anchor="middle" font-size="12" fill="#5d5d70">units of the CRS</text>
</g>
