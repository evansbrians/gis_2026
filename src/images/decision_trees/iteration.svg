<rect x="218.9" y="183.0" width="68.1" height="17.0" rx="3" fill="#ffffff"/>
<text x="253.0" y="194.0" text-anchor="middle" font-size="12" fill="#4a5aa0">one thing</text>
<rect x="187.9" y="418.0" width="130.2" height="30.0" rx="3" fill="#ffffff"/>
<text x="253.0" y="429.0" text-anchor="middle" font-size="12" fill="#4a5aa0">one thing, and you</text>
<text x="253.0" y="442.0" text-anchor="middle" font-size="12" fill="#4a5aa0">need its name</text>
<rect x="187.9" y="514.0" width="130.2" height="30.0" rx="3" fill="#ffffff"/>
<text x="253.0" y="525.0" text-anchor="middle" font-size="12" fill="#4a5aa0">several arguments,</text>
<text x="253.0" y="538.0" text-anchor="middle" font-size="12" fill="#4a5aa0">varying together</text>
<rect x="627.8" y="39.0" width="47.4" height="17.0" rx="3" fill="#ffffff"/>
<text x="651.5" y="50.0" text-anchor="middle" font-size="12" fill="#4a5aa0">a list</text>
<rect x="600.2" y="135.0" width="102.6" height="17.0" rx="3" fill="#ffffff"/>
<text x="651.5" y="146.0" text-anchor="middle" font-size="12" fill="#4a5aa0">a typed vector</text>
<rect x="607.1" y="231.0" width="88.8" height="17.0" rx="3" fill="#ffffff"/>
<text x="651.5" y="242.0" text-anchor="middle" font-size="12" fill="#4a5aa0">a data frame</text>
<rect x="624.4" y="327.0" width="54.3" height="17.0" rx="3" fill="#ffffff"/>
<text x="651.5" y="338.0" text-anchor="middle" font-size="12" fill="#4a5aa0">a side effect</text>
<rect x="8.0" y="344.0" width="156" height="64" rx="9" fill="#eaf0ff" stroke="#292093" stroke-width="2.0"/>
<text x="86.0" y="371.0" text-anchor="middle" font-size="15" fill="#333333">What varies</text>
<text x="86.0" y="390.0" text-anchor="middle" font-size="15" fill="#333333">across the calls?</text>
<rect x="332.0" y="172.0" width="244" height="64" rx="9" fill="#eaf0ff" stroke="#292093" stroke-width="2.0"/>
<text x="454.0" y="199.0" text-anchor="middle" font-size="15" fill="#333333">What do you</text>
<text x="454.0" y="218.0" text-anchor="middle" font-size="15" fill="#333333">want back?</text>
<rect x="332.0" y="413.0" width="244" height="78" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="454.0" y="441.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">imap()   iwalk()</text>
<text x="454.0" y="458.0" text-anchor="middle" font-size="12" fill="#5d5d70">the element and name or position</text>
<text x="454.0" y="474.0" text-anchor="middle" font-size="12" fill="#5d5d70">a list or a side effect</text>
<rect x="332.0" y="509.0" width="244" height="78" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="454.0" y="537.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">pmap()</text>
<text x="454.0" y="554.0" text-anchor="middle" font-size="12" fill="#5d5d70">iterates the rows of a data frame,</text>
<text x="454.0" y="570.0" text-anchor="middle" font-size="12" fill="#5d5d70">one formal per column</text>
<rect x="717.0" y="21.0" width="321" height="78" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="877.5" y="49.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">map()</text>
<text x="877.5" y="66.0" text-anchor="middle" font-size="12" fill="#5d5d70">a list, one element</text>
<text x="877.5" y="82.0" text-anchor="middle" font-size="12" fill="#5d5d70">per input element</text>
<rect x="717.0" y="117.0" width="321" height="78" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="877.5" y="145.0" text-anchor="middle" font-size="12" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">map_lgl()  map_int()  map_dbl()  map_chr()</text>
<text x="877.5" y="162.0" text-anchor="middle" font-size="12" fill="#5d5d70">an atomic vector; an error if a call</text>
<text x="877.5" y="178.0" text-anchor="middle" font-size="12" fill="#5d5d70">returns the wrong length or type</text>
<rect x="717.0" y="213.0" width="321" height="78" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="877.5" y="241.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">map() %&gt;% bind_rows()</text>
<text x="877.5" y="258.0" text-anchor="middle" font-size="12" fill="#5d5d70">one data frame; bind_rows() keeps</text>
<text x="877.5" y="274.0" text-anchor="middle" font-size="12" fill="#5d5d70">the simple features class</text>
<rect x="717.0" y="309.0" width="321" height="78" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="877.5" y="337.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">walk()</text>
<text x="877.5" y="354.0" text-anchor="middle" font-size="12" fill="#5d5d70">the side effect is what matters</text>
<text x="877.5" y="370.0" text-anchor="middle" font-size="12" fill="#5d5d70">the input returns invisibly</text>
</g>
</svg>
