<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 653" width="960" height="653" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" role="img">
<rect width="960" height="653" fill="#ffffff"/>
<text x="480" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#292093">Decision tree: Tidying a data frame</text>
<line x1="40" y1="50" x2="920" y2="50" stroke="#9db0e6" stroke-width="1.2"/>
<g transform="translate(0,52)">
<path d="M 132.0 324.0 H 144.0 V 148.0 H 335.0" fill="none" stroke="#9db0e6" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="346.0,148.0 334.0,143.0 334.0,153.0" fill="#9db0e6"/>
