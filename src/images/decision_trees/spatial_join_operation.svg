<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 577 301" width="577" height="301" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" role="img">
<rect width="577" height="301" fill="#ffffff"/>
<text x="288" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#292093">Decision tree: Spatial join operations</text>
<line x1="40" y1="50" x2="537" y2="50" stroke="#9db0e6" stroke-width="1.2"/>
<g transform="translate(0,52)">
<path d="M 148.0 118.0 H 160.0 V 64.0 H 338.0" fill="none" stroke="#9db0e6" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="349.0,64.0 337.0,59.0 337.0,69.0" fill="#9db0e6"/>
<path d="M 148.0 118.0 H 160.0 V 172.0 H 338.0" fill="none" stroke="#9db0e6" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="349.0,172.0 337.0,167.0 337.0,177.0" fill="#9db0e6"/>
<rect x="192.8" y="30.0" width="123.3" height="30.0" rx="3" fill="#ffffff"/>
<text x="254.5" y="41.0" text-anchor="middle" font-size="12" fill="#4a5aa0">a subset of the</text>
<text x="254.5" y="54.0" text-anchor="middle" font-size="12" fill="#4a5aa0">object's features</text>
<rect x="172.1" y="138.0" width="164.7" height="30.0" rx="3" fill="#ffffff"/>
<text x="254.5" y="149.0" text-anchor="middle" font-size="12" fill="#4a5aa0">the object, with fields</text>
<text x="254.5" y="162.0" text-anchor="middle" font-size="12" fill="#4a5aa0">from another object</text>
<rect x="8.0" y="86.0" width="140" height="64" rx="9" fill="#eaf0ff" stroke="#292093" stroke-width="2.0"/>
<text x="78.0" y="113.0" text-anchor="middle" font-size="15" fill="#333333">What do you</text>
<text x="78.0" y="132.0" text-anchor="middle" font-size="15" fill="#333333">want to return?</text>
<rect x="351.0" y="25.0" width="218" height="78" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="460.0" y="53.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">st_filter()</text>
<text x="460.0" y="70.0" text-anchor="middle" font-size="12" fill="#5d5d70">predicate via .predicate =</text>
<text x="460.0" y="86.0" text-anchor="middle" font-size="12" fill="#5d5d70">returns the matching features</text>
<rect x="351.0" y="125.0" width="218" height="94" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="460.0" y="153.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">st_join()</text>
<text x="460.0" y="170.0" text-anchor="middle" font-size="12" fill="#5d5d70">predicate via join =</text>
<text x="460.0" y="186.0" text-anchor="middle" font-size="12" fill="#5d5d70">a row for every match;</text>
<text x="460.0" y="202.0" text-anchor="middle" font-size="12" fill="#5d5d70">left = keeps or drops the rest</text>
</g>
</svg>
