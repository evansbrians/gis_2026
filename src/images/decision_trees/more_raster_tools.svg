<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 739 713" width="739" height="713" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="739" height="713" fill="#ffffff"/>
<text x="370" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#292093">Decision tree: Deriving new objects from a raster</text>
<line x1="40" y1="50" x2="699" y2="50" stroke="#9db0e6" stroke-width="1.2"/>
<g transform="translate(0,52)">
