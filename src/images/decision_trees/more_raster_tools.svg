<polygon points="313.0,274.0 301.0,269.0 301.0,279.0" fill="#9db0e6"/>
<path d="M 140.0 327.0 H 152.0 V 380.0 H 302.0" fill="none" stroke="#9db0e6" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="313.0,380.0 301.0,375.0 301.0,385.0" fill="#9db0e6"/>
