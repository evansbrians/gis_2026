<polygon points="313.0,592.0 301.0,587.0 301.0,597.0" fill="#9db0e6"/>
<rect x="177.8" y="28.0" width="109.5" height="30.0" rx="3" fill="#ffffff"/>
<text x="232.5" y="39.0" text-anchor="middle" font-size="12" fill="#4a5aa0">one raster from</text>
<text x="232.5" y="52.0" text-anchor="middle" font-size="12" fill="#4a5aa0">several tiles</text>
<rect x="181.2" y="134.0" width="102.6" height="30.0" rx="3" fill="#ffffff"/>
<text x="232.5" y="145.0" text-anchor="middle" font-size="12" fill="#4a5aa0">a larger or</text>
<text x="232.5" y="158.0" text-anchor="middle" font-size="12" fill="#4a5aa0">smaller extent</text>
<rect x="188.1" y="240.0" width="88.8" height="30.0" rx="3" fill="#ffffff"/>
<text x="232.5" y="251.0" text-anchor="middle" font-size="12" fill="#4a5aa0">a sample</text>
<text x="232.5" y="264.0" text-anchor="middle" font-size="12" fill="#4a5aa0">of locations</text>
<rect x="163.9" y="346.0" width="137.1" height="30.0" rx="3" fill="#ffffff"/>
<text x="232.5" y="357.0" text-anchor="middle" font-size="12" fill="#4a5aa0">the distance to the</text>
<text x="232.5" y="370.0" text-anchor="middle" font-size="12" fill="#4a5aa0">nearest feature</text>
<rect x="163.9" y="452.0" width="137.1" height="30.0" rx="3" fill="#ffffff"/>
<text x="232.5" y="463.0" text-anchor="middle" font-size="12" fill="#4a5aa0">lines at set values</text>
<text x="232.5" y="476.0" text-anchor="middle" font-size="12" fill="#4a5aa0">of a surface</text>
<rect x="170.8" y="558.0" width="123.3" height="30.0" rx="3" fill="#ffffff"/>
<text x="232.5" y="569.0" text-anchor="middle" font-size="12" fill="#4a5aa0">the connected</text>
<text x="232.5" y="582.0" text-anchor="middle" font-size="12" fill="#4a5aa0">groups of a class</text>
<rect x="8.0" y="295.0" width="132" height="64" rx="9" fill="#eaf0ff" stroke="#292093" stroke-width="2.0"/>
<text x="74.0" y="322.0" text-anchor="middle" font-size="15" fill="#333333">What does the</text>
<text x="74.0" y="341.0" text-anchor="middle" font-size="15" fill="#333333">question need?</text>
<rect x="315.0" y="23.0" width="416" height="78" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="523.0" y="51.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">merge()  or  mosaic()</text>
<text x="523.0" y="68.0" text-anchor="middle" font-size="12" fill="#5d5d70">both need a shared origin and resolution; merge() keeps</text>
<text x="523.0" y="84.0" text-anchor="middle" font-size="12" fill="#5d5d70">the first tile's values in the overlap, mosaic() a statistic</text>
<rect x="315.0" y="129.0" width="416" height="78" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="523.0" y="157.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">extend()  and  trim()</text>
<text x="523.0" y="174.0" text-anchor="middle" font-size="12" fill="#5d5d70">extend() adds rows and columns of NA around a raster;</text>
<text x="523.0" y="190.0" text-anchor="middle" font-size="12" fill="#5d5d70">trim() removes outer rows and columns that hold only NA</text>
<rect x="315.0" y="235.0" width="416" height="78" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="523.0" y="263.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">spatSample()</text>
<text x="523.0" y="280.0" text-anchor="middle" font-size="12" fill="#5d5d70">method random, regular or stratified; as.points = TRUE</text>
<text x="523.0" y="296.0" text-anchor="middle" font-size="12" fill="#5d5d70">for a vector, na.rm = TRUE to skip empty cells</text>
<rect x="315.0" y="341.0" width="416" height="78" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="523.0" y="369.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">rasterize()  then  distance()</text>
<text x="523.0" y="386.0" text-anchor="middle" font-size="12" fill="#5d5d70">meters in a projected CRS with square cells; a distance</text>
<text x="523.0" y="402.0" text-anchor="middle" font-size="12" fill="#5d5d70">surface is a raster, so extract() reads it at points</text>
<rect x="315.0" y="455.0" width="416" height="62" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="523.0" y="483.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">as.contour()</text>
<text x="523.0" y="500.0" text-anchor="middle" font-size="12" fill="#5d5d70">levels sets the values; one MULTILINESTRING per level</text>
<rect x="315.0" y="553.0" width="416" height="78" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="523.0" y="581.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">ifel()  then  patches()</text>
<text x="523.0" y="598.0" text-anchor="middle" font-size="12" fill="#5d5d70">set every other class to NA first; directions = 8 connects</text>
<text x="523.0" y="614.0" text-anchor="middle" font-size="12" fill="#5d5d70">corners; zonal() on cellSize() measures each patch</text>
</g>
</svg>
