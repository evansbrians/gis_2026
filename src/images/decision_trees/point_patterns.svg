<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 807" width="550" height="807" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="550" height="807" fill="#ffffff"/>
<text x="275" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#292093">Workflow: Describing a point pattern</text>
<line x1="40" y1="50" x2="510" y2="50" stroke="#9db0e6" stroke-width="1.2"/>
<g transform="translate(0,52)">
<path d="M 275.0 135.0 V 168.0" fill="none" stroke="#9db0e6" stroke-width="1.8"/>
<polygon points="275.0,179.0 270.0,167.0 280.0,167.0" fill="#9db0e6"/>
<rect x="258.2" y="151.0" width="33.6" height="17.0" rx="3" fill="#ffffff"/>
<text x="275.0" y="162.0" text-anchor="middle" font-size="12" fill="#4a5aa0">then</text>
<path d="M 275.0 292.0 V 325.0" fill="none" stroke="#9db0e6" stroke-width="1.8"/>
<polygon points="275.0,336.0 270.0,324.0 280.0,324.0" fill="#9db0e6"/>
<rect x="258.2" y="308.0" width="33.6" height="17.0" rx="3" fill="#ffffff"/>
<text x="275.0" y="319.0" text-anchor="middle" font-size="12" fill="#4a5aa0">then</text>
<path d="M 275.0 417.0 V 450.0" fill="none" stroke="#9db0e6" stroke-width="1.8"/>
<polygon points="275.0,461.0 270.0,449.0 280.0,449.0" fill="#9db0e6"/>
<rect x="261.6" y="433.0" width="26.7" height="17.0" rx="3" fill="#ffffff"/>
<text x="275.0" y="444.0" text-anchor="middle" font-size="12" fill="#4a5aa0">and</text>
<path d="M 275.0 574.0 V 607.0" fill="none" stroke="#9db0e6" stroke-width="1.8"/>
<polygon points="275.0,618.0 270.0,606.0 280.0,606.0" fill="#9db0e6"/>
<rect x="258.2" y="590.0" width="33.6" height="17.0" rx="3" fill="#ffffff"/>
<text x="275.0" y="601.0" text-anchor="middle" font-size="12" fill="#4a5aa0">then</text>
<rect x="8.0" y="40.0" width="534" height="95" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="275.0" y="65.0" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.2" fill="#292093">DEFINE THE EVENTS</text>
<text x="275.0" y="85.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">st_nearest_feature()   st_distance(by_element = TRUE)</text>
<text x="275.0" y="102.0" text-anchor="middle" font-size="12" fill="#5d5d70">a nearest-neighbor distance of zero marks records that</text>
<text x="275.0" y="118.0" text-anchor="middle" font-size="12" fill="#5d5d70">share a location; remove those that are not events</text>
<rect x="8.0" y="181.0" width="534" height="111" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="275.0" y="206.0" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.2" fill="#292093">DEFINE THE WINDOW</text>
<text x="275.0" y="226.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">st_buffer()   st_filter()</text>
<text x="275.0" y="243.0" text-anchor="middle" font-size="12" fill="#5d5d70">the area in which an event could have been recorded;</text>
<text x="275.0" y="259.0" text-anchor="middle" font-size="12" fill="#5d5d70">buffer the mapped boundary where the search passed it, and</text>
<text x="275.0" y="275.0" text-anchor="middle" font-size="12" fill="#5d5d70">state the choice, because every statistic depends on it</text>
<rect x="8.0" y="338.0" width="534" height="79" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="275.0" y="363.0" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.2" fill="#292093">INTENSITY</text>
<text x="275.0" y="383.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">st_intersects()  %&gt;%  lengths()   /   st_area()</text>
<text x="275.0" y="400.0" text-anchor="middle" font-size="12" fill="#5d5d70">events per unit of area: how many, not how arranged</text>
<rect x="8.0" y="463.0" width="534" height="111" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="275.0" y="488.0" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.2" fill="#292093">ARRANGEMENT</text>
<text x="275.0" y="508.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">st_make_grid()   var(nests) / mean(nests)</text>
<text x="275.0" y="525.0" text-anchor="middle" font-size="12" fill="#5d5d70">quadrat counts at the scale of the quadrat: the ratio is</text>
<text x="275.0" y="541.0" text-anchor="middle" font-size="12" fill="#5d5d70">above one for a clustered pattern; nearest-neighbor</text>
<text x="275.0" y="557.0" text-anchor="middle" font-size="12" fill="#5d5d70">distances describe the spacing without a grid</text>
<rect x="8.0" y="620.0" width="534" height="111" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="275.0" y="645.0" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.2" fill="#292093">COMPARE WITH CHANCE</text>
<text x="275.0" y="665.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">st_sample()  inside  map_dbl()</text>
<text x="275.0" y="682.0" text-anchor="middle" font-size="12" fill="#5d5d70">random patterns of the same size in the same window;</text>
<text x="275.0" y="698.0" text-anchor="middle" font-size="12" fill="#5d5d70">report where the observed statistic falls among them,</text>
<text x="275.0" y="714.0" text-anchor="middle" font-size="12" fill="#5d5d70">with the seed and the number of draws</text>
</g>
</svg>
