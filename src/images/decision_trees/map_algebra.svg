<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 697 550" width="697" height="550" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" role="img">
<rect width="697" height="550" fill="#ffffff"/>
<text x="348" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#292093">Decision tree: Choosing a map algebra operation</text>
<line x1="40" y1="50" x2="657" y2="50" stroke="#9db0e6" stroke-width="1.2"/>
<g transform="translate(0,52)">
<path d="M 124.0 245.0 H 136.0 V 62.0 H 286.0" fill="none" stroke="#9db0e6" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="297.0,62.0 285.0,57.0 285.0,67.0" fill="#9db0e6"/>
<path d="M 124.0 245.0 H 136.0 V 184.0 H 286.0" fill="none" stroke="#9db0e6" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="297.0,184.0 285.0,179.0 285.0,189.0" fill="#9db0e6"/>
<path d="M 124.0 245.0 H 136.0 V 306.0 H 286.0" fill="none" stroke="#9db0e6" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="297.0,306.0 285.0,301.0 285.0,311.0" fill="#9db0e6"/>
<path d="M 124.0 245.0 H 136.0 V 428.0 H 286.0" fill="none" stroke="#9db0e6" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="297.0,428.0 285.0,423.0 285.0,433.0" fill="#9db0e6"/>
<rect x="168.7" y="41.0" width="95.7" height="17.0" rx="3" fill="#ffffff"/>
<text x="216.5" y="52.0" text-anchor="middle" font-size="12" fill="#4a5aa0">from one cell</text>
<rect x="147.9" y="150.0" width="137.1" height="30.0" rx="3" fill="#ffffff"/>
<text x="216.5" y="161.0" text-anchor="middle" font-size="12" fill="#4a5aa0">from a neighborhood</text>
<text x="216.5" y="174.0" text-anchor="middle" font-size="12" fill="#4a5aa0">around each cell</text>
<rect x="161.8" y="272.0" width="109.5" height="30.0" rx="3" fill="#ffffff"/>
<text x="216.5" y="283.0" text-anchor="middle" font-size="12" fill="#4a5aa0">from every cell</text>
<text x="216.5" y="296.0" text-anchor="middle" font-size="12" fill="#4a5aa0">of a class</text>
<rect x="175.6" y="394.0" width="81.9" height="30.0" rx="3" fill="#ffffff"/>
<text x="216.5" y="405.0" text-anchor="middle" font-size="12" fill="#4a5aa0">from the</text>
<text x="216.5" y="418.0" text-anchor="middle" font-size="12" fill="#4a5aa0">whole layer</text>
<rect x="8.0" y="213.0" width="116" height="64" rx="9" fill="#eaf0ff" stroke="#292093" stroke-width="2.0"/>
<text x="66.0" y="240.0" text-anchor="middle" font-size="15" fill="#333333">What is the</text>
<text x="66.0" y="259.0" text-anchor="middle" font-size="15" fill="#333333">calculation?</text>
<rect x="299.0" y="6.5" width="390" height="111" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="494.0" y="31.5" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.2" fill="#292093">LOCAL</text>
<text x="494.0" y="51.5" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">arithmetic     ifel()     classify()</text>
<text x="494.0" y="68.5" text-anchor="middle" font-size="12" fill="#5d5d70">arithmetic keeps the name of its first operand;</text>
<text x="494.0" y="84.5" text-anchor="middle" font-size="12" fill="#5d5d70">classify() takes a matrix of lower bound, upper</text>
<text x="494.0" y="100.5" text-anchor="middle" font-size="12" fill="#5d5d70">bound and new value; NA in either input returns NA</text>
<rect x="299.0" y="128.5" width="390" height="111" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="494.0" y="153.5" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.2" fill="#292093">FOCAL</text>
<text x="494.0" y="173.5" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">focal()</text>
<text x="494.0" y="190.5" text-anchor="middle" font-size="12" fill="#5d5d70">w is an odd number of cells, not a distance;</text>
<text x="494.0" y="206.5" text-anchor="middle" font-size="12" fill="#5d5d70">fun takes a name or a function of your own; the</text>
<text x="494.0" y="222.5" text-anchor="middle" font-size="12" fill="#5d5d70">mean of a zero-one layer is the proportion of the window</text>
<rect x="299.0" y="258.5" width="390" height="95" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="494.0" y="283.5" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.2" fill="#292093">ZONAL</text>
<text x="494.0" y="303.5" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">zonal()</text>
<text x="494.0" y="320.5" text-anchor="middle" font-size="12" fill="#5d5d70">summarizes one raster within the classes of another,</text>
<text x="494.0" y="336.5" text-anchor="middle" font-size="12" fill="#5d5d70">and the two have to share a grid</text>
<rect x="299.0" y="388.5" width="390" height="79" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="494.0" y="413.5" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.2" fill="#292093">GLOBAL</text>
<text x="494.0" y="433.5" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">global()</text>
<text x="494.0" y="450.5" text-anchor="middle" font-size="12" fill="#5d5d70">returns one row per layer rather than a raster</text>
</g>
</svg>
