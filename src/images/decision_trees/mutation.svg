<rect x="8.0" y="310.0" width="116" height="64" rx="9" fill="#eaf0ff" stroke="#292093" stroke-width="2.0"/>
<text x="66.0" y="337.0" text-anchor="middle" font-size="15" fill="#333333">What are you</text>
<text x="66.0" y="356.0" text-anchor="middle" font-size="15" fill="#333333">changing?</text>
<rect x="285.0" y="152.0" width="140" height="64" rx="9" fill="#eaf0ff" stroke="#292093" stroke-width="2.0"/>
<text x="355.0" y="179.0" text-anchor="middle" font-size="15" fill="#333333">What supplies</text>
<text x="355.0" y="198.0" text-anchor="middle" font-size="15" fill="#333333">the new values?</text>
<rect x="566.0" y="21.0" width="369" height="62" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="750.5" y="49.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">mutate(name = calculation)</text>
<text x="750.5" y="66.0" text-anchor="middle" font-size="12" fill="#5d5d70">a new name adds, an existing name replaces</text>
<rect x="566.0" y="109.0" width="369" height="62" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="750.5" y="137.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">mutate(name = row_number())</text>
<text x="750.5" y="154.0" text-anchor="middle" font-size="12" fill="#5d5d70">1 to the number of rows</text>
<rect x="566.0" y="205.0" width="369" height="46" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="750.5" y="233.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">mutate(col = replace_na(col, value))</text>
<rect x="566.0" y="293.0" width="369" height="46" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="750.5" y="321.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">mutate(col = na_if(col, value))</text>
<rect x="566.0" y="381.0" width="369" height="62" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="750.5" y="409.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">mutate(.before = col)</text>
<text x="750.5" y="426.0" text-anchor="middle" font-size="12" fill="#5d5d70">places the new column</text>
<rect x="566.0" y="469.0" width="369" height="62" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="750.5" y="497.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">mutate(.keep = "none")</text>
<text x="750.5" y="514.0" text-anchor="middle" font-size="12" fill="#5d5d70">returns only the columns named</text>
