<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 637 607" width="637" height="607" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" role="img">
<rect width="637" height="607" fill="#ffffff"/>
<text x="318" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#292093">Decision tree: Working with points</text>
<line x1="40" y1="50" x2="597" y2="50" stroke="#9db0e6" stroke-width="1.2"/>
<g transform="translate(0,52)">
<path d="M 164.0 274.0 H 176.0 V 62.0 H 319.0" fill="none" stroke="#9db0e6" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="330.0,62.0 318.0,57.0 318.0,67.0" fill="#9db0e6"/>
<path d="M 164.0 274.0 H 176.0 V 168.0 H 319.0" fill="none" stroke="#9db0e6" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="330.0,168.0 318.0,163.0 318.0,173.0" fill="#9db0e6"/>
<path d="M 164.0 274.0 H 176.0 V 274.0 H 319.0" fill="none" stroke="#9db0e6" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="330.0,274.0 318.0,269.0 318.0,279.0" fill="#9db0e6"/>
<path d="M 164.0 274.0 H 176.0 V 380.0 H 319.0" fill="none" stroke="#9db0e6" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="330.0,380.0 318.0,375.0 318.0,385.0" fill="#9db0e6"/>
<path d="M 164.0 274.0 H 176.0 V 486.0 H 319.0" fill="none" stroke="#9db0e6" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="330.0,486.0 318.0,481.0 318.0,491.0" fill="#9db0e6"/>
<rect x="198.2" y="28.0" width="109.5" height="30.0" rx="3" fill="#ffffff"/>
<text x="253.0" y="39.0" text-anchor="middle" font-size="12" fill="#4a5aa0">records that</text>
<text x="253.0" y="52.0" text-anchor="middle" font-size="12" fill="#4a5aa0">are not repeats</text>
<rect x="212.1" y="134.0" width="81.9" height="30.0" rx="3" fill="#ffffff"/>
<text x="253.0" y="145.0" text-anchor="middle" font-size="12" fill="#4a5aa0">one feature</text>
<text x="253.0" y="158.0" text-anchor="middle" font-size="12" fill="#4a5aa0">per group</text>
<rect x="191.3" y="240.0" width="123.3" height="30.0" rx="3" fill="#ffffff"/>
<text x="253.0" y="251.0" text-anchor="middle" font-size="12" fill="#4a5aa0">one row per point</text>
<text x="253.0" y="264.0" text-anchor="middle" font-size="12" fill="#4a5aa0">from a multipoint</text>
<rect x="187.9" y="346.0" width="130.2" height="30.0" rx="3" fill="#ffffff"/>
<text x="253.0" y="357.0" text-anchor="middle" font-size="12" fill="#4a5aa0">one point to stand</text>
<text x="253.0" y="370.0" text-anchor="middle" font-size="12" fill="#4a5aa0">for a polygon</text>
<rect x="205.2" y="452.0" width="95.7" height="30.0" rx="3" fill="#ffffff"/>
<text x="253.0" y="463.0" text-anchor="middle" font-size="12" fill="#4a5aa0">points across</text>
<text x="253.0" y="476.0" text-anchor="middle" font-size="12" fill="#4a5aa0">a study area</text>
<rect x="8.0" y="242.0" width="156" height="64" rx="9" fill="#eaf0ff" stroke="#292093" stroke-width="2.0"/>
<text x="86.0" y="269.0" text-anchor="middle" font-size="15" fill="#333333">What do you need</text>
<text x="86.0" y="288.0" text-anchor="middle" font-size="15" fill="#333333">from your points?</text>
<rect x="332.0" y="23.0" width="297" height="78" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="480.5" y="51.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">distinct()</text>
<text x="480.5" y="68.0" text-anchor="middle" font-size="12" fill="#5d5d70">the geometry is a column, so it takes part</text>
<text x="480.5" y="84.0" text-anchor="middle" font-size="12" fill="#5d5d70">unless st_drop_geometry() removes it first</text>
<rect x="332.0" y="129.0" width="297" height="78" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="480.5" y="157.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">summarize()</text>
<text x="480.5" y="174.0" text-anchor="middle" font-size="12" fill="#5d5d70">unions each group into a MULTIPOINT,</text>
<text x="480.5" y="190.0" text-anchor="middle" font-size="12" fill="#5d5d70">holding each position once</text>
<rect x="332.0" y="235.0" width="297" height="78" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="480.5" y="263.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">st_cast("POINT")</text>
<text x="480.5" y="280.0" text-anchor="middle" font-size="12" fill="#5d5d70">one row per point, with the fields copied</text>
<text x="480.5" y="296.0" text-anchor="middle" font-size="12" fill="#5d5d70">onto every one of them</text>
<rect x="332.0" y="341.0" width="297" height="78" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="480.5" y="369.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">st_point_on_surface()</text>
<text x="480.5" y="386.0" text-anchor="middle" font-size="12" fill="#5d5d70">a point inside the polygon; st_centroid()</text>
<text x="480.5" y="402.0" text-anchor="middle" font-size="12" fill="#5d5d70">can fall outside a long or curved one</text>
<rect x="332.0" y="447.0" width="297" height="78" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="480.5" y="475.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">st_sample()</text>
<text x="480.5" y="492.0" text-anchor="middle" font-size="12" fill="#5d5d70">size is exact for random sampling and</text>
<text x="480.5" y="508.0" text-anchor="middle" font-size="12" fill="#5d5d70">approximate for regular and hexagonal</text>
</g>
</svg>
