<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 623" width="1040" height="623" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" role="img">
<rect width="1040" height="623" fill="#ffffff"/>
<text x="520" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#292093">Workflow: From an elevation model to a terrain map</text>
<line x1="40" y1="50" x2="1000" y2="50" stroke="#9db0e6" stroke-width="1.2"/>
<g transform="translate(0,52)">
<path d="M 199.5 150.0 V 183.0" fill="none" stroke="#9db0e6" stroke-width="1.8"/>
<polygon points="199.5,194.0 194.5,182.0 204.5,182.0" fill="#9db0e6"/>
<rect x="182.7" y="166.0" width="33.6" height="17.0" rx="3" fill="#ffffff"/>
<text x="199.5" y="177.0" text-anchor="middle" font-size="12" fill="#4a5aa0">then</text>
<path d="M 799.0 137.0 V 166.0" fill="none" stroke="#9db0e6" stroke-width="1.8"/>
<polygon points="799.0,177.0 794.0,165.0 804.0,165.0" fill="#9db0e6"/>
<rect x="782.2" y="151.0" width="33.6" height="17.0" rx="3" fill="#ffffff"/>
<text x="799.0" y="162.0" text-anchor="middle" font-size="12" fill="#4a5aa0">then</text>
<path d="M 799.0 405.0 V 434.0" fill="none" stroke="#9db0e6" stroke-width="1.8"/>
<polygon points="799.0,445.0 794.0,433.0 804.0,433.0" fill="#9db0e6"/>
<rect x="782.2" y="419.0" width="33.6" height="17.0" rx="3" fill="#ffffff"/>
<text x="799.0" y="430.0" text-anchor="middle" font-size="12" fill="#4a5aa0">then</text>
<path d="M 391.0 228.0 H 403.0 V 90.0 H 553.0" fill="none" stroke="#9db0e6" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="564.0,90.0 552.0,85.0 552.0,95.0" fill="#9db0e6"/>
<path d="M 391.0 228.0 H 403.0 V 366.0 H 553.0" fill="none" stroke="#9db0e6" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="564.0,366.0 552.0,361.0 552.0,371.0" fill="#9db0e6"/>
<rect x="435.6" y="69.0" width="95.7" height="17.0" rx="3" fill="#ffffff"/>
<text x="483.5" y="80.0" text-anchor="middle" font-size="12" fill="#4a5aa0">on a flat map</text>
<rect x="414.9" y="345.0" width="137.1" height="17.0" rx="3" fill="#ffffff"/>
<text x="483.5" y="356.0" text-anchor="middle" font-size="12" fill="#4a5aa0">in three dimensions</text>
<rect x="8.0" y="40.0" width="383" height="110" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="199.5" y="68.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">terrain(v = , unit = )</text>
<text x="199.5" y="85.0" text-anchor="middle" font-size="12" fill="#5d5d70">calculate from the original elevation model, with</text>
<text x="199.5" y="101.0" text-anchor="middle" font-size="12" fill="#5d5d70">elevations in meters and a known CRS; returns slope,</text>
<text x="199.5" y="117.0" text-anchor="middle" font-size="12" fill="#5d5d70">aspect, TPI, TRI, roughness and flowdir; aspect is</text>
<text x="199.5" y="133.0" text-anchor="middle" font-size="12" fill="#5d5d70">circular, so take cos() in radians rather than its mean</text>
<rect x="8.0" y="196.0" width="383" height="64" rx="9" fill="#eaf0ff" stroke="#292093" stroke-width="2.0"/>
<text x="199.5" y="223.0" text-anchor="middle" font-size="15" fill="#333333">How do you want to</text>
<text x="199.5" y="242.0" text-anchor="middle" font-size="15" fill="#333333">show the surface?</text>
<rect x="566.0" y="43.0" width="466" height="94" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="799.0" y="71.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">shade(slope, aspect, angle, direction)</text>
<text x="799.0" y="88.0" text-anchor="middle" font-size="12" fill="#5d5d70">slope and aspect in radians; angle is the elevation of</text>
<text x="799.0" y="104.0" text-anchor="middle" font-size="12" fill="#5d5d70">the light and direction its bearing, conventionally 315,</text>
<text x="799.0" y="120.0" text-anchor="middle" font-size="12" fill="#5d5d70">because a light from the southeast inverts the relief</text>
<rect x="566.0" y="179.0" width="466" height="94" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="799.0" y="207.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">ggnewscale::new_scale_fill()</text>
<text x="799.0" y="224.0" text-anchor="middle" font-size="12" fill="#5d5d70">sits between two geom_spatraster() calls: the grey</text>
<text x="799.0" y="240.0" text-anchor="middle" font-size="12" fill="#5d5d70">hillshade below, the colored layer above it with alpha,</text>
<text x="799.0" y="256.0" text-anchor="middle" font-size="12" fill="#5d5d70">so the relief shows through the colors</text>
<rect x="566.0" y="327.0" width="466" height="78" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="799.0" y="355.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">project()  then  rayshader::raster_to_matrix()</text>
<text x="799.0" y="372.0" text-anchor="middle" font-size="12" fill="#5d5d70">put horizontal spacing and elevation in compatible</text>
<text x="799.0" y="388.0" text-anchor="middle" font-size="12" fill="#5d5d70">units, then let raster_to_matrix() handle orientation</text>
<rect x="566.0" y="447.0" width="466" height="94" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="799.0" y="475.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">sphere_shade()  ray_shade()  add_shadow()</text>
<text x="799.0" y="492.0" text-anchor="middle" font-size="12" fill="#5d5d70">then plot_map() for an image or plot_3d() for a scene;</text>
<text x="799.0" y="508.0" text-anchor="middle" font-size="12" fill="#5d5d70">zscale is the horizontal cell spacing divided by the</text>
<text x="799.0" y="524.0" text-anchor="middle" font-size="12" fill="#5d5d70">vertical unit, and ray_shade() is slow: build it small</text>
</g>
</svg>
