<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 838 816" width="838" height="816" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" role="img">
<rect width="838" height="816" fill="#ffffff"/>
<text x="419" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#292093">The raster model, and what follows from it</text>
<line x1="40" y1="50" x2="798" y2="50" stroke="#9db0e6" stroke-width="1.2"/>
<g transform="translate(0,52)">
<path d="M 244.0 387.0 H 256.0 V 687.0 H 427.0" fill="none" stroke="#9db0e6" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="438.0,687.0 426.0,682.0 426.0,692.0" fill="#9db0e6"/>
<path d="M 244.0 387.0 H 256.0 V 567.0 H 427.0" fill="none" stroke="#9db0e6" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="438.0,567.0 426.0,562.0 426.0,572.0" fill="#9db0e6"/>
<path d="M 244.0 387.0 H 256.0 V 447.0 H 427.0" fill="none" stroke="#9db0e6" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="438.0,447.0 426.0,442.0 426.0,452.0" fill="#9db0e6"/>
<path d="M 244.0 387.0 H 256.0 V 327.0 H 427.0" fill="none" stroke="#9db0e6" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="438.0,327.0 426.0,322.0 426.0,332.0" fill="#9db0e6"/>
<path d="M 244.0 387.0 H 256.0 V 207.0 H 427.0" fill="none" stroke="#9db0e6" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="438.0,207.0 426.0,202.0 426.0,212.0" fill="#9db0e6"/>
<path d="M 244.0 387.0 H 256.0 V 87.0 H 427.0" fill="none" stroke="#9db0e6" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="438.0,87.0 426.0,82.0 426.0,92.0" fill="#9db0e6"/>
<rect x="295.7" y="666.0" width="102.6" height="17.0" rx="3" fill="#ffffff"/>
<text x="347.0" y="677.0" text-anchor="middle" font-size="12" fill="#4a5aa0">writing a file</text>
<rect x="285.4" y="533.0" width="123.3" height="30.0" rx="3" fill="#ffffff"/>
<text x="347.0" y="544.0" text-anchor="middle" font-size="12" fill="#4a5aa0">when two axes are</text>
<text x="347.0" y="557.0" text-anchor="middle" font-size="12" fill="#4a5aa0">not enough</text>
<rect x="268.1" y="426.0" width="157.8" height="17.0" rx="3" fill="#ffffff"/>
<text x="347.0" y="437.0" text-anchor="middle" font-size="12" fill="#4a5aa0">combining measurements</text>
<rect x="275.0" y="293.0" width="144.0" height="30.0" rx="3" fill="#ffffff"/>
<text x="347.0" y="304.0" text-anchor="middle" font-size="12" fill="#4a5aa0">so a failing cell is</text>
<text x="347.0" y="317.0" text-anchor="middle" font-size="12" fill="#4a5aa0">emptied, not removed</text>
<rect x="281.9" y="186.0" width="130.2" height="17.0" rx="3" fill="#ffffff"/>
<text x="347.0" y="197.0" text-anchor="middle" font-size="12" fill="#4a5aa0">the size of a cell</text>
<rect x="295.7" y="66.0" width="102.6" height="17.0" rx="3" fill="#ffffff"/>
<text x="347.0" y="77.0" text-anchor="middle" font-size="12" fill="#4a5aa0">reading a file</text>
<rect x="8.0" y="345.5" width="236" height="83" rx="9" fill="#eaf0ff" stroke="#292093" stroke-width="2.0"/>
<text x="126.0" y="372.5" text-anchor="middle" font-size="15" fill="#333333">A value for each cell</text>
<text x="126.0" y="391.5" text-anchor="middle" font-size="15" fill="#333333">of a regular grid; location</text>
<text x="126.0" y="410.5" text-anchor="middle" font-size="15" fill="#333333">calculated from the grid</text>
<rect x="440.0" y="40.0" width="390" height="94" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="635.0" y="68.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">terra::rast()   terra::inMemory()</text>
<text x="635.0" y="85.0" text-anchor="middle" font-size="12" fill="#5d5d70">the header is a few numbers whatever the size of the</text>
<text x="635.0" y="101.0" text-anchor="middle" font-size="12" fill="#5d5d70">file, so the values stay on disk; the source line is a</text>
<text x="635.0" y="117.0" text-anchor="middle" font-size="12" fill="#5d5d70">filename until an operation puts the result in memory</text>
<rect x="440.0" y="160.0" width="390" height="94" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="635.0" y="188.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">terra::res()   terra::cellSize()</text>
<text x="635.0" y="205.0" text-anchor="middle" font-size="12" fill="#5d5d70">res() is in the units of the CRS, so it is an angle in</text>
<text x="635.0" y="221.0" text-anchor="middle" font-size="12" fill="#5d5d70">a geographic one; cellSize() calculates area on the</text>
<text x="635.0" y="237.0" text-anchor="middle" font-size="12" fill="#5d5d70">ground after accounting for the CRS</text>
<rect x="440.0" y="280.0" width="390" height="94" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="635.0" y="308.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">filter()</text>
<text x="635.0" y="325.0" text-anchor="middle" font-size="12" fill="#5d5d70">empties the failing cells rather than removing them,</text>
<text x="635.0" y="341.0" text-anchor="middle" font-size="12" fill="#5d5d70">so ncell() does not move and a count of cells stops</text>
<text x="635.0" y="357.0" text-anchor="middle" font-size="12" fill="#5d5d70">being a count of values</text>
<rect x="440.0" y="400.0" width="390" height="94" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="635.0" y="428.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">c()   select()   rename()   mutate()</text>
<text x="635.0" y="445.0" text-anchor="middle" font-size="12" fill="#5d5d70">c() stacks rasters that share a grid, matched by</text>
<text x="635.0" y="461.0" text-anchor="middle" font-size="12" fill="#5d5d70">position; the verbs then address layers the way their</text>
<text x="635.0" y="477.0" text-anchor="middle" font-size="12" fill="#5d5d70">dplyr forms address columns</text>
<rect x="440.0" y="520.0" width="390" height="94" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="635.0" y="548.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">read_stars()</text>
<text x="635.0" y="565.0" text-anchor="middle" font-size="12" fill="#5d5d70">a cube with a named dimension for every axis, useful</text>
<text x="635.0" y="581.0" text-anchor="middle" font-size="12" fill="#5d5d70">when time, depth or spectral band is central to the</text>
<text x="635.0" y="597.0" text-anchor="middle" font-size="12" fill="#5d5d70">analysis</text>
<rect x="440.0" y="640.0" width="390" height="94" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="635.0" y="668.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">terra::writeRaster()</text>
<text x="635.0" y="685.0" text-anchor="middle" font-size="12" fill="#5d5d70">datatype sets the bits per cell and truncates the values</text>
<text x="635.0" y="701.0" text-anchor="middle" font-size="12" fill="#5d5d70">that do not fit; compression changes file size without</text>
<text x="635.0" y="717.0" text-anchor="middle" font-size="12" fill="#5d5d70">changing cell values</text>
</g>
</svg>
