<polygon points="774.0,274.0 762.0,269.0 762.0,279.0" fill="#9db0e6"/>
<rect x="206.5" y="8.0" width="75.0" height="30.0" rx="3" fill="#ffffff"/>
<text x="244.0" y="19.0" text-anchor="middle" font-size="12" fill="#4a5aa0">where the</text>
<text x="244.0" y="32.0" text-anchor="middle" font-size="12" fill="#4a5aa0">feature is</text>
<rect x="216.8" y="147.0" width="54.3" height="17.0" rx="3" fill="#ffffff"/>
<text x="244.0" y="158.0" text-anchor="middle" font-size="12" fill="#4a5aa0">a field</text>
<rect x="690.6" y="41.0" width="26.7" height="17.0" rx="3" fill="#ffffff"/>
<text x="704.0" y="52.0" text-anchor="middle" font-size="12" fill="#4a5aa0">two</text>
<rect x="652.7" y="134.0" width="102.6" height="30.0" rx="3" fill="#ffffff"/>
<text x="704.0" y="145.0" text-anchor="middle" font-size="12" fill="#4a5aa0">more than two,</text>
<text x="704.0" y="158.0" text-anchor="middle" font-size="12" fill="#4a5aa0">no catch-all</text>
<rect x="645.8" y="240.0" width="116.4" height="30.0" rx="3" fill="#ffffff"/>
<text x="704.0" y="251.0" text-anchor="middle" font-size="12" fill="#4a5aa0">more than two,</text>
<text x="704.0" y="264.0" text-anchor="middle" font-size="12" fill="#4a5aa0">with a catch-all</text>
<rect x="8.0" y="73.0" width="140" height="64" rx="9" fill="#eaf0ff" stroke="#292093" stroke-width="2.0"/>
<text x="78.0" y="100.0" text-anchor="middle" font-size="15" fill="#333333">What is the</text>
<text x="78.0" y="119.0" text-anchor="middle" font-size="15" fill="#333333">class based on?</text>
<rect x="330.0" y="3.0" width="292" height="78" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="476.0" y="31.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">lengths(st_intersects()) &gt; 0</text>
<text x="476.0" y="48.0" text-anchor="middle" font-size="12" fill="#5d5d70">a spatial predicate returns a condition,</text>
<text x="476.0" y="64.0" text-anchor="middle" font-size="12" fill="#5d5d70">which is what the functions below take</text>
<rect x="330.0" y="126.5" width="292" height="83" rx="9" fill="#eaf0ff" stroke="#292093" stroke-width="2.0"/>
<text x="476.0" y="153.5" text-anchor="middle" font-size="15" fill="#333333">How many classes,</text>
<text x="476.0" y="172.5" text-anchor="middle" font-size="15" fill="#333333">and is there a</text>
<text x="476.0" y="191.5" text-anchor="middle" font-size="15" fill="#333333">catch-all?</text>
<rect x="776.0" y="23.0" width="304" height="78" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="928.0" y="51.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">if_else()</text>
<text x="928.0" y="68.0" text-anchor="middle" font-size="12" fill="#5d5d70">a condition, a value for TRUE and one for</text>
<text x="928.0" y="84.0" text-anchor="middle" font-size="12" fill="#5d5d70">FALSE, and a missing condition returns NA</text>
<rect x="776.0" y="129.0" width="304" height="78" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="928.0" y="157.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">case_when()</text>
<text x="928.0" y="174.0" text-anchor="middle" font-size="12" fill="#5d5d70">the first matching condition sets the class</text>
<text x="928.0" y="190.0" text-anchor="middle" font-size="12" fill="#5d5d70">order overlapping conditions deliberately</text>
<rect x="776.0" y="235.0" width="304" height="78" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="928.0" y="263.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">case_when(.default = )</text>
<text x="928.0" y="280.0" text-anchor="middle" font-size="12" fill="#5d5d70">returns the catch-all for rows matching no</text>
<text x="928.0" y="296.0" text-anchor="middle" font-size="12" fill="#5d5d70">condition, so handle missing values first</text>
</g>
</svg>
