<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 492 830" width="492" height="830" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" role="img">
<rect width="492" height="830" fill="#ffffff"/>
<text x="246" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#292093">Workflow: Building a movement track</text>
<line x1="40" y1="50" x2="452" y2="50" stroke="#9db0e6" stroke-width="1.2"/>
<g transform="translate(0,52)">
<path d="M 246.0 118.0 V 151.0" fill="none" stroke="#9db0e6" stroke-width="1.8"/>
<polygon points="246.0,162.0 241.0,150.0 251.0,150.0" fill="#9db0e6"/>
<rect x="229.2" y="134.0" width="33.6" height="17.0" rx="3" fill="#ffffff"/>
<text x="246.0" y="145.0" text-anchor="middle" font-size="12" fill="#4a5aa0">then</text>
<path d="M 246.0 242.0 V 275.0" fill="none" stroke="#9db0e6" stroke-width="1.8"/>
<polygon points="246.0,286.0 241.0,274.0 251.0,274.0" fill="#9db0e6"/>
<rect x="229.2" y="258.0" width="33.6" height="17.0" rx="3" fill="#ffffff"/>
<text x="246.0" y="269.0" text-anchor="middle" font-size="12" fill="#4a5aa0">then</text>
<path d="M 246.0 382.0 V 415.0" fill="none" stroke="#9db0e6" stroke-width="1.8"/>
<polygon points="246.0,426.0 241.0,414.0 251.0,414.0" fill="#9db0e6"/>
<rect x="229.2" y="398.0" width="33.6" height="17.0" rx="3" fill="#ffffff"/>
<text x="246.0" y="409.0" text-anchor="middle" font-size="12" fill="#4a5aa0">then</text>
<path d="M 246.0 506.0 V 539.0" fill="none" stroke="#9db0e6" stroke-width="1.8"/>
<polygon points="246.0,550.0 241.0,538.0 251.0,538.0" fill="#9db0e6"/>
<rect x="229.2" y="522.0" width="33.6" height="17.0" rx="3" fill="#ffffff"/>
<text x="246.0" y="533.0" text-anchor="middle" font-size="12" fill="#4a5aa0">then</text>
<path d="M 246.0 630.0 V 663.0" fill="none" stroke="#9db0e6" stroke-width="1.8"/>
<polygon points="246.0,674.0 241.0,662.0 251.0,662.0" fill="#9db0e6"/>
<rect x="229.2" y="646.0" width="33.6" height="17.0" rx="3" fill="#ffffff"/>
<text x="246.0" y="657.0" text-anchor="middle" font-size="12" fill="#4a5aa0">then</text>
<rect x="8.0" y="40.0" width="476" height="78" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="246.0" y="68.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">st_as_sf()  then  st_transform()</text>
<text x="246.0" y="85.0" text-anchor="middle" font-size="12" fill="#5d5d70">records to points, in a projected CRS;</text>
<text x="246.0" y="101.0" text-anchor="middle" font-size="12" fill="#5d5d70">lonlat_to_utm() returns the zone</text>
<rect x="8.0" y="164.0" width="476" height="78" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="246.0" y="192.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">arrange(animal_id, timestamp)</text>
<text x="246.0" y="209.0" text-anchor="middle" font-size="12" fill="#5d5d70">a line is an ordered set of points, and the</text>
<text x="246.0" y="225.0" text-anchor="middle" font-size="12" fill="#5d5d70">order comes from the data rather than the geometry</text>
<rect x="8.0" y="288.0" width="476" height="94" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="246.0" y="316.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">st_distance(by_element = TRUE)  and  difftime()</text>
<text x="246.0" y="333.0" text-anchor="middle" font-size="12" fill="#5d5d70">the step length and the elapsed time between</text>
<text x="246.0" y="349.0" text-anchor="middle" font-size="12" fill="#5d5d70">consecutive records, each read against lag(), grouped</text>
<text x="246.0" y="365.0" text-anchor="middle" font-size="12" fill="#5d5d70">by individual so one animal is not compared with the next</text>
<rect x="8.0" y="428.0" width="476" height="78" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="246.0" y="456.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">cumsum(gap_hours &gt; threshold)</text>
<text x="246.0" y="473.0" text-anchor="middle" font-size="12" fill="#5d5d70">numbers the bursts; state the threshold, and</text>
<text x="246.0" y="489.0" text-anchor="middle" font-size="12" fill="#5d5d70">drop the bursts holding a single fix</text>
<rect x="8.0" y="552.0" width="476" height="78" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="246.0" y="580.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">summarize(do_union = FALSE)  then  st_cast()</text>
<text x="246.0" y="597.0" text-anchor="middle" font-size="12" fill="#5d5d70">combines each burst's points in the order of</text>
<text x="246.0" y="613.0" text-anchor="middle" font-size="12" fill="#5d5d70">the rows, and collapses them into one line</text>
<rect x="8.0" y="676.0" width="476" height="78" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="246.0" y="704.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">st_length()  then  units::set_units()</text>
<text x="246.0" y="721.0" text-anchor="middle" font-size="12" fill="#5d5d70">measured in the units of the CRS, on the plane</text>
<text x="246.0" y="737.0" text-anchor="middle" font-size="12" fill="#5d5d70">for a projected CRS and the sphere for a geographic one</text>
</g>
</svg>
