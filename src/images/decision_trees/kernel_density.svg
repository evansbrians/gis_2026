<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 599 759" width="599" height="759" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="599" height="759" fill="#ffffff"/>
<text x="300" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#292093">Workflow: Building a density surface</text>
<line x1="40" y1="50" x2="559" y2="50" stroke="#9db0e6" stroke-width="1.2"/>
<g transform="translate(0,52)">
<path d="M 299.5 119.0 V 152.0" fill="none" stroke="#9db0e6" stroke-width="1.8"/>
<polygon points="299.5,163.0 294.5,151.0 304.5,151.0" fill="#9db0e6"/>
<rect x="282.7" y="135.0" width="33.6" height="17.0" rx="3" fill="#ffffff"/>
<text x="299.5" y="146.0" text-anchor="middle" font-size="12" fill="#4a5aa0">then</text>
<path d="M 299.5 244.0 V 277.0" fill="none" stroke="#9db0e6" stroke-width="1.8"/>
<polygon points="299.5,288.0 294.5,276.0 304.5,276.0" fill="#9db0e6"/>
<rect x="282.7" y="260.0" width="33.6" height="17.0" rx="3" fill="#ffffff"/>
<text x="299.5" y="271.0" text-anchor="middle" font-size="12" fill="#4a5aa0">then</text>
<path d="M 299.5 385.0 V 418.0" fill="none" stroke="#9db0e6" stroke-width="1.8"/>
<polygon points="299.5,429.0 294.5,417.0 304.5,417.0" fill="#9db0e6"/>
<rect x="282.7" y="401.0" width="33.6" height="17.0" rx="3" fill="#ffffff"/>
<text x="299.5" y="412.0" text-anchor="middle" font-size="12" fill="#4a5aa0">then</text>
<path d="M 299.5 526.0 V 559.0" fill="none" stroke="#9db0e6" stroke-width="1.8"/>
<polygon points="299.5,570.0 294.5,558.0 304.5,558.0" fill="#9db0e6"/>
<rect x="282.7" y="542.0" width="33.6" height="17.0" rx="3" fill="#ffffff"/>
<text x="299.5" y="553.0" text-anchor="middle" font-size="12" fill="#4a5aa0">then</text>
<rect x="8.0" y="40.0" width="583" height="79" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="299.5" y="65.0" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.2" fill="#292093">A GRID</text>
<text x="299.5" y="85.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">vect()  %&gt;%  rast(resolution = )</text>
<text x="299.5" y="102.0" text-anchor="middle" font-size="12" fill="#5d5d70">an empty raster over the area, in a projected CRS</text>
<rect x="8.0" y="165.0" width="583" height="79" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="299.5" y="190.0" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.2" fill="#292093">COUNTS</text>
<text x="299.5" y="210.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">rasterize(fun = "length", background = 0)</text>
<text x="299.5" y="227.0" text-anchor="middle" font-size="12" fill="#5d5d70">the records in each cell; zero, not NA, where none fell</text>
<rect x="8.0" y="290.0" width="583" height="95" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="299.5" y="315.0" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.2" fill="#292093">A KERNEL</text>
<text x="299.5" y="335.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">focalMat(d = , type = "Gauss")</text>
<text x="299.5" y="352.0" text-anchor="middle" font-size="12" fill="#5d5d70">weights that sum to one; d is the bandwidth, chosen from</text>
<text x="299.5" y="368.0" text-anchor="middle" font-size="12" fill="#5d5d70">the scale of the question and reported with the map</text>
<rect x="8.0" y="431.0" width="583" height="95" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="299.5" y="456.0" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.2" fill="#292093">THE SURFACE</text>
<text x="299.5" y="476.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">focal(w = kernel, fun = "sum", na.rm = TRUE)  /  cell area</text>
<text x="299.5" y="493.0" text-anchor="middle" font-size="12" fill="#5d5d70">records per cell, then per square kilometer; the sum is</text>
<text x="299.5" y="509.0" text-anchor="middle" font-size="12" fill="#5d5d70">the count less the weight that reached past the edges</text>
<rect x="8.0" y="572.0" width="583" height="111" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="299.5" y="597.0" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.2" fill="#292093">READ IT</text>
<text x="299.5" y="617.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">where.max()   xyFromCell()   terra::extract()   mask()</text>
<text x="299.5" y="634.0" text-anchor="middle" font-size="12" fill="#5d5d70">locate the peak, read the density at points, blank the</text>
<text x="299.5" y="650.0" text-anchor="middle" font-size="12" fill="#5d5d70">cells outside the area; build the surface from observers</text>
<text x="299.5" y="666.0" text-anchor="middle" font-size="12" fill="#5d5d70">to test whether a peak describes effort</text>
</g>
</svg>
