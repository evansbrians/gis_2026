<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 608 759" width="608" height="759" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="608" height="759" fill="#ffffff"/>
<text x="304" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#292093">Workflow: Reducing what a script costs</text>
<line x1="40" y1="50" x2="568" y2="50" stroke="#9db0e6" stroke-width="1.2"/>
<g transform="translate(0,52)">
<path d="M 304.0 135.0 V 168.0" fill="none" stroke="#9db0e6" stroke-width="1.8"/>
<polygon points="304.0,179.0 299.0,167.0 309.0,167.0" fill="#9db0e6"/>
<rect x="287.2" y="151.0" width="33.6" height="17.0" rx="3" fill="#ffffff"/>
<text x="304.0" y="162.0" text-anchor="middle" font-size="12" fill="#4a5aa0">then</text>
<path d="M 304.0 276.0 V 309.0" fill="none" stroke="#9db0e6" stroke-width="1.8"/>
<polygon points="304.0,320.0 299.0,308.0 309.0,308.0" fill="#9db0e6"/>
<rect x="287.2" y="292.0" width="33.6" height="17.0" rx="3" fill="#ffffff"/>
<text x="304.0" y="303.0" text-anchor="middle" font-size="12" fill="#4a5aa0">then</text>
<path d="M 304.0 417.0 V 450.0" fill="none" stroke="#9db0e6" stroke-width="1.8"/>
<polygon points="304.0,461.0 299.0,449.0 309.0,449.0" fill="#9db0e6"/>
<rect x="287.2" y="433.0" width="33.6" height="17.0" rx="3" fill="#ffffff"/>
<text x="304.0" y="444.0" text-anchor="middle" font-size="12" fill="#4a5aa0">then</text>
<path d="M 304.0 542.0 V 575.0" fill="none" stroke="#9db0e6" stroke-width="1.8"/>
<polygon points="304.0,586.0 299.0,574.0 309.0,574.0" fill="#9db0e6"/>
<rect x="287.2" y="558.0" width="33.6" height="17.0" rx="3" fill="#ffffff"/>
<text x="304.0" y="569.0" text-anchor="middle" font-size="12" fill="#4a5aa0">then</text>
<rect x="8.0" y="40.0" width="592" height="95" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="304.0" y="65.0" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.2" fill="#292093">MEASURE</text>
<text x="304.0" y="85.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">obj_size()   bench::mark()   profvis()</text>
<text x="304.0" y="102.0" text-anchor="middle" font-size="12" fill="#5d5d70">the size of an object, its geometry and its fields; the</text>
<text x="304.0" y="118.0" text-anchor="middle" font-size="12" fill="#5d5d70">time of alternatives; the slow line of a whole script</text>
<rect x="8.0" y="181.0" width="592" height="95" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="304.0" y="206.0" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.2" fill="#292093">READ LESS</text>
<text x="304.0" y="226.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">st_write() to a GeoPackage, then query =  and  wkt_filter =</text>
<text x="304.0" y="243.0" text-anchor="middle" font-size="12" fill="#5d5d70">the fields, rows and area the question needs, read before</text>
<text x="304.0" y="259.0" text-anchor="middle" font-size="12" fill="#5d5d70">the data reach R; on a text file a query parses everything</text>
<rect x="8.0" y="322.0" width="592" height="95" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="304.0" y="347.0" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.2" fill="#292093">KEEP LESS</text>
<text x="304.0" y="367.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">select()   st_drop_geometry()   st_simplify()   aggregate()</text>
<text x="304.0" y="384.0" text-anchor="middle" font-size="12" fill="#5d5d70">drop the fields and the geometry a question does not use;</text>
<text x="304.0" y="400.0" text-anchor="middle" font-size="12" fill="#5d5d70">simplify or aggregate a copy for drawing</text>
<rect x="8.0" y="463.0" width="592" height="79" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="304.0" y="488.0" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.2" fill="#292093">SAVE WHAT WAS BUILT</text>
<text x="304.0" y="508.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">write_rds()  then  read_rds()</text>
<text x="304.0" y="525.0" text-anchor="middle" font-size="12" fill="#5d5d70">run the pre-processing once and read its result</text>
<rect x="8.0" y="588.0" width="592" height="95" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="304.0" y="613.0" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.2" fill="#292093">LET TERRA MANAGE THE VALUES</text>
<text x="304.0" y="633.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">inMemory()   sources()   mem_info()   writeRaster()</text>
<text x="304.0" y="650.0" text-anchor="middle" font-size="12" fill="#5d5d70">rast() reads the header; a result stays in memory when it</text>
<text x="304.0" y="666.0" text-anchor="middle" font-size="12" fill="#5d5d70">fits and goes to a temporary file when it does not</text>
</g>
</svg>
