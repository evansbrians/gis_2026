<text x="183.0" y="565.0" text-anchor="middle" font-size="12" fill="#5d5d70">@fig-name refers to the figure</text>
<text x="183.0" y="581.0" text-anchor="middle" font-size="12" fill="#5d5d70">inline code supplies computed values</text>
