<text x="183.0" y="101.0" text-anchor="middle" font-size="12" fill="#5d5d70">format: html carries an interactive map</text>
<text x="183.0" y="117.0" text-anchor="middle" font-size="12" fill="#5d5d70">embed-resources: true supports one-file sharing</text>
<rect x="8.0" y="168.0" width="350" height="94" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="183.0" y="196.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">setup and preprocessing chunk</text>
<text x="183.0" y="213.0" text-anchor="middle" font-size="12" fill="#5d5d70">include: false</text>
<text x="183.0" y="229.0" text-anchor="middle" font-size="12" fill="#5d5d70">attach packages, set the tmap mode,</text>
<text x="183.0" y="245.0" text-anchor="middle" font-size="12" fill="#5d5d70">read and clean, leaving cache: true off data reads</text>
<rect x="8.0" y="296.0" width="350" height="62" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="183.0" y="324.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">the question, in prose</text>
<text x="183.0" y="341.0" text-anchor="middle" font-size="12" fill="#5d5d70">Markdown: headings, emphasis, lists</text>
<rect x="8.0" y="392.0" width="350" height="94" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="183.0" y="420.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">the figure</text>
<text x="183.0" y="437.0" text-anchor="middle" font-size="12" fill="#5d5d70">label: fig-name for cross-referencing,</text>
<text x="183.0" y="453.0" text-anchor="middle" font-size="12" fill="#5d5d70">fig-cap for what it is, fig-alt for what it</text>
<text x="183.0" y="469.0" text-anchor="middle" font-size="12" fill="#5d5d70">shows, fig-width and fig-height for its size</text>
<rect x="8.0" y="520.0" width="350" height="78" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
