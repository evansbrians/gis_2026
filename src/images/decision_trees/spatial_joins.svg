<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1015 491" width="1015" height="491" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" role="img">
<rect width="1015" height="491" fill="#ffffff"/>
<text x="508" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#292093">Decision tree: Spatial joins</text>
<line x1="40" y1="50" x2="975" y2="50" stroke="#9db0e6" stroke-width="1.2"/>
<g transform="translate(0,52)">
<path d="M 116.0 164.0 H 128.0 V 60.0 H 319.0" fill="none" stroke="#9db0e6" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="330.0,60.0 318.0,55.0 318.0,65.0" fill="#9db0e6"/>
<path d="M 116.0 164.0 H 128.0 V 268.0 H 319.0" fill="none" stroke="#9db0e6" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="330.0,268.0 318.0,263.0 318.0,273.0" fill="#9db0e6"/>
<path d="M 563.0 268.0 H 575.0 V 166.0 H 732.0" fill="none" stroke="#9db0e6" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="743.0,166.0 731.0,161.0 731.0,171.0" fill="#9db0e6"/>
<path d="M 563.0 268.0 H 575.0 V 268.0 H 732.0" fill="none" stroke="#9db0e6" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="743.0,268.0 731.0,263.0 731.0,273.0" fill="#9db0e6"/>
<path d="M 563.0 268.0 H 575.0 V 370.0 H 732.0" fill="none" stroke="#9db0e6" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="743.0,370.0 731.0,365.0 731.0,375.0" fill="#9db0e6"/>
<rect x="184.6" y="26.0" width="88.8" height="30.0" rx="3" fill="#ffffff"/>
<text x="229.0" y="37.0" text-anchor="middle" font-size="12" fill="#4a5aa0">a subset of</text>
<text x="229.0" y="50.0" text-anchor="middle" font-size="12" fill="#4a5aa0">the features</text>
<rect x="139.8" y="234.0" width="178.5" height="30.0" rx="3" fill="#ffffff"/>
<text x="229.0" y="245.0" text-anchor="middle" font-size="12" fill="#4a5aa0">the features, plus fields</text>
<text x="229.0" y="258.0" text-anchor="middle" font-size="12" fill="#4a5aa0">from another object</text>
<rect x="604.2" y="132.0" width="109.5" height="30.0" rx="3" fill="#ffffff"/>
<text x="659.0" y="143.0" text-anchor="middle" font-size="12" fill="#4a5aa0">a feature</text>
<text x="659.0" y="156.0" text-anchor="middle" font-size="12" fill="#4a5aa0">matches nothing</text>
<rect x="597.4" y="234.0" width="123.3" height="30.0" rx="3" fill="#ffffff"/>
<text x="659.0" y="245.0" text-anchor="middle" font-size="12" fill="#4a5aa0">a feature matches</text>
<text x="659.0" y="258.0" text-anchor="middle" font-size="12" fill="#4a5aa0">more than once</text>
<rect x="587.0" y="336.0" width="144.0" height="30.0" rx="3" fill="#ffffff"/>
<text x="659.0" y="347.0" text-anchor="middle" font-size="12" fill="#4a5aa0">you want the closest</text>
<text x="659.0" y="360.0" text-anchor="middle" font-size="12" fill="#4a5aa0">feature regardless</text>
<rect x="8.0" y="132.0" width="108" height="64" rx="9" fill="#eaf0ff" stroke="#292093" stroke-width="2.0"/>
<text x="62.0" y="159.0" text-anchor="middle" font-size="15" fill="#333333">What do you</text>
<text x="62.0" y="178.0" text-anchor="middle" font-size="15" fill="#333333">want back?</text>
<rect x="332.0" y="21.0" width="231" height="78" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="447.5" y="49.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">st_filter()</text>
<text x="447.5" y="66.0" text-anchor="middle" font-size="12" fill="#5d5d70">predicate via .predicate =</text>
<text x="447.5" y="82.0" text-anchor="middle" font-size="12" fill="#5d5d70">returns features, adds no fields</text>
<rect x="332.0" y="237.0" width="231" height="62" rx="9" fill="#eaf0ff" stroke="#292093" stroke-width="2.0"/>
<text x="447.5" y="265.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">st_join()</text>
<text x="447.5" y="282.0" text-anchor="middle" font-size="12" fill="#5d5d70">predicate via join =</text>
<rect x="745.0" y="127.0" width="262" height="78" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="876.0" y="155.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">left =</text>
<text x="876.0" y="172.0" text-anchor="middle" font-size="12" fill="#5d5d70">TRUE keeps the feature, fields NA</text>
<text x="876.0" y="188.0" text-anchor="middle" font-size="12" fill="#5d5d70">FALSE drops it</text>
<rect x="745.0" y="229.0" width="262" height="78" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="876.0" y="257.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">largest =</text>
<text x="876.0" y="274.0" text-anchor="middle" font-size="12" fill="#5d5d70">FALSE returns a row per match</text>
<text x="876.0" y="290.0" text-anchor="middle" font-size="12" fill="#5d5d70">TRUE returns the greatest overlap</text>
<rect x="745.0" y="331.0" width="262" height="78" rx="9" fill="#ffffff" stroke="#9db0e6" stroke-width="1.6"/>
<text x="876.0" y="359.0" text-anchor="middle" font-size="15" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#292093">join = st_nearest_feature</text>
<text x="876.0" y="376.0" text-anchor="middle" font-size="12" fill="#5d5d70">matches non-empty geometries</text>
<text x="876.0" y="392.0" text-anchor="middle" font-size="12" fill="#5d5d70">at any distance, reports no distance</text>
</g>
</svg>
